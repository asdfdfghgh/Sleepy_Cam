[package]
name = "sleepycam-ai"
version = "2.0.0"
description = "SleepyCam AI - On-Device Fatigue & Sleepiness Monitoring Desktop Application"
authors = ["SleepyCam AI"]
edition = "2021"

[lib]
name = "sleepycam_ai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
