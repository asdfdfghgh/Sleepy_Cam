    <meta name="description" content="Multi-modal real-time webcam fatigue and sleepiness detection system analyzing eye metrics (EAR, PERCLOS), yawning (MAR), head pose, posture, and facial activity with personalized baseline calibration and machine learning." />
    <meta property="og:title" content="SleepyCam AI - Real-Time Fatigue &amp; Sleepiness Detection" />
    <meta property="og:description" content="Multi-modal real-time webcam fatigue and sleepiness detection system analyzing eye metrics (EAR, PERCLOS), yawning (MAR), head pose, posture, and facial activity with personalized baseline calibration and machine learning." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- PWA & Platform Meta Tags -->
    <meta name="theme-color" content="#cecbcb" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SleepyCam" />

    <!-- Typography (2+1 Rule: Plus Jakarta Sans + DM Sans + JetBrains Mono) -->

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Initial Theme Sync (Robot Studio Grey Default) -->
    <script>
      (function() {
        try {
          var raw = localStorage.getItem('sleepycam_settings');
          if (raw && JSON.parse(raw).theme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (_) {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>

    <!-- Defensive shim for iframe environments and TFLite Emscripten stderr redirection -->
    <script>
      (function() {
        try {
          var _origFetch = window.fetch;
          var _curFetch = _origFetch;
          try {
            Object.defineProperty(window, 'fetch', {
              get: function() { return _curFetch; },
              set: function(val) { _curFetch = val; },
              configurable: true,
              enumerable: true
            });
          } catch (e1) {
            if (window.Window && window.Window.prototype) {
              try {
                Object.defineProperty(window.Window.prototype, 'fetch', {
                  get: function() { return _curFetch; },
                  set: function(val) { _curFetch = val; },
                  configurable: true,
                  enumerable: true
                });
              } catch (e2) {}
            }
          }
        } catch (_) {}

        try {
          var _origError = console.error;
          console.error = function() {
            var msg = arguments[0];
            if (typeof msg === 'string') {
              if (
                msg.indexOf('INFO:') === 0 ||
                msg.indexOf('XNNPACK delegate') !== -1 ||
                msg.indexOf('TensorFlow Lite') !== -1
              ) {
                if (console.info) {
                  console.info.apply(console, arguments);
                }
                return;
              }
            }
            return _origError.apply(console, arguments);
          };
        } catch (_) {}

        window.addEventListener('error', function(e) {
          if (e && e.message) {
            if (e.message.indexOf('fetch') !== -1 && e.message.indexOf('getter') !== -1) {
              e.preventDefault();
              e.stopImmediatePropagation();
              return true;
            }
            if (
              e.message.indexOf('XNNPACK') !== -1 ||
              e.message.indexOf('TensorFlow Lite') !== -1 ||
              e.message.indexOf('INFO:') === 0
            ) {
              e.preventDefault();
              e.stopImmediatePropagation();
              return true;
            }
          }
        }, true);
      })();
    </script>
  </head>
  <body class="bg-[#cecbcb] dark:bg-[#111317] text-[#0a0b0e] dark:text-[#f4f6f8] antialiased selection:bg-[#00ffc6]/30">

    <script type="module" src="/src/main.tsx"></script>
  </body>
